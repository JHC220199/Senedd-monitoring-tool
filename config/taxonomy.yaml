# -----------------------------------------------------------------------------
# ENTITIES
# -----------------------------------------------------------------------------
# People, organisations and bodies whose involvement changes how much an item
# matters. An entity boost is added ON TOP of any theme weight.
#
# IMPORTANT: entity boosts do NOT by themselves make an item relevant. An item
# that matches no theme is discarded regardless of who spoke, otherwise every
# health question asked by the housing minister would be flagged. Entity
# boosts amplify relevance; they do not create it.
#
# VERIFY THIS SECTION after every reshuffle, by-election or committee change.
# Last verified against press reporting 4 August 2026; the Senedd's own
# committee pages had not yet been updated for the Seventh Senedd.
# -----------------------------------------------------------------------------


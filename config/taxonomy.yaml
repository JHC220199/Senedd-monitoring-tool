# -----------------------------------------------------------------------------
# SOURCES — what to collect at all
# -----------------------------------------------------------------------------
# Switches, not weights. Set one to `false` and that source is never fetched, so
# it costs no requests and adds nothing to the archive.
#
# This exists so overlap with other NRLA tools can be turned off without editing
# code. Duplicate coverage is worse than a gap: two systems reporting the same
# written question means two people think the other one is handling it.
# -----------------------------------------------------------------------------
sources:
  # OFF: the policy directorate has a separate tool that tracks Senedd written
  # questions, so collecting them here would duplicate it. Turning this off also
  # removes the largest block of requests in a run — the seed-query sweep across
  # the Record's search — so runs are faster as well as cleaner.
  #
  # Historical written questions already in the archive stay searchable. To
  # remove them too:  python -m monitor.cli prune --source written_question
  written_questions: false

  # ON: oral and topical questions are asked in the Chamber and appear in the
  # transcripts anyway, so excluding them would leave holes in debates. These are
  # a different thing from written questions.
  oral_questions: true

  # ON: statements of opinion show which MSs are willing to put their name to a
  # position, which is exactly what a lobbying team wants to know.
  statements_of_opinion: true

# -----------------------------------------------------------------------------
# SOURCE MULTIPLIERS
# -----------------------------------------------------------------------------
# Not all sources carry equal weight. A minister's statement in Plenary is
# worth more than a backbencher's passing reference in an unrelated debate.
# Multipliers are applied to the summed score.
# -----------------------------------------------------------------------------

source_multipliers:
  consultation: 1.4          # time-limited: missing one is unrecoverable
  legislation: 1.3           # bills and SIs are the hard edge of policy
  committee_transcript: 1.15
  plenary_transcript: 1.1
  written_question: 1.0
  oral_question: 1.0
  written_statement: 1.1
  press_release: 0.9
  calendar: 0.8
  other: 1.0

# -----------------------------------------------------------------------------
# CONTRIBUTION-TYPE HANDLING
# -----------------------------------------------------------------------------
# The Senedd Record XML tags each contribution with a type. Some are procedural
# furniture and should never reach the dashboard.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# PROCEDURAL AGENDA ITEMS
# -----------------------------------------------------------------------------
# Agenda items that are pure committee housekeeping. They appear at every single
# meeting and contain no policy content, but they scored High and Critical
# because the surrounding text mentions the committee's own name and its remit.
#
# Two real examples from the dashboard that prompted this list:
#   "1. Introductions, apologies, substitutions and declarations of interest"
#   "2. Papers to note"
#
# Matched as a prefix on the agenda item title, case-insensitively, after any
# leading item number. Add to this list rather than fighting the scores.
# -----------------------------------------------------------------------------
procedural_agenda_items:
  - Introductions, apologies
  - Introduction, apologies
  - Apologies, substitutions
  - Papers to note
  - Paper to note
  - Minutes of the previous meeting
  - Motion under Standing Order 17.42
  - Motion under Standing Order 17.22
  - Private session
  - Date of the next meeting
  - Any other business
  - Declarations of interest
  - Election of a temporary Chair
  - Instruments that raise no reporting issues
  - Instruments that raise issues to be reported

contribution_types:
  C: { label: "Contribution",       include: true  }
  I: { label: "Information",        include: false }   # bilingual notices, [R] explainers
  B: { label: "Business item",      include: true  }
  O: { label: "Other",              include: true  }
  V: { label: "Vote",               include: true  }
  QNR: { label: "Question not reached", include: true }

# -----------------------------------------------------------------------------
# PRIORITY BANDS
# -----------------------------------------------------------------------------
# `min_score` is inclusive. Bands are evaluated highest first.
#
# `channel` determines routing:
#   immediate  -> alert email within the hour + dashboard
#   digest     -> daily digest email + dashboard
#   dashboard  -> dashboard and archive only, no email
#   archive    -> stored and searchable, hidden from default dashboard view
# -----------------------------------------------------------------------------

bands:
  # Colours follow the NRLA palette: brand orange #E96C19 for High, brand dark
  # blue #113B54 for Medium, with a deep red reserved for Critical so it reads
  # as an exception rather than as part of the normal run of business.
  - name: "Critical"
    min_score: 130
    colour: "#A32115"
    channel: immediate
    description: >
      Direct, material and usually time-limited. A consultation on rent data, a
      bill stage on eviction reform, the NRLA named in the Chamber. Someone
      should look at this today.

  - name: "High"
    min_score: 85
    colour: "#E96C19"
    channel: digest
    description: >
      Substantive business on a core NRLA issue. Belongs in the next digest and
      probably needs a position or a line to take.

  - name: "Medium"
    min_score: 50
    colour: "#113B54"
    channel: digest
    description: >
      Relevant and worth knowing. Grouped and summarised rather than
      individually flagged.

  - name: "Low"
    min_score: 25
    colour: "#5A7286"
    channel: dashboard
    description: >
      Peripheral or passing references. Available on the dashboard for anyone
      who wants the full picture.

  - name: "Noise"
    min_score: 0
    colour: "#9AA5AF"
    channel: archive
    description: >
      Matched something, but weakly. Kept only so the archive remains
      searchable and so tuning decisions can be audited.

# -----------------------------------------------------------------------------
# THE PUBLIC PAGE (docs/index.html — the hosted database)
# -----------------------------------------------------------------------------
# The archive stores everything so trend questions can be answered later; the
# PAGE shows only what is relevant to the NRLA. The directorate's verdict on
# the first version was that it listed "every single consultation" and was
# unusable for exactly that reason. This section is the fix, and it is meant
# to be edited by policy staff.
#
# An item earns a place on the page if EITHER:
#   1. it matches at least one theme NOT listed in `non_qualifying_themes`
#      (i.e. a substantive housing/PRS theme, not just generic Senedd
#      machinery), OR
#   2. its TITLE contains one of `always_relevant_in_title` — the housing
#      committee's own business (its priorities consultation, forward work
#      programme, scheduled meetings) is inherently relevant even before an
#      agenda gives it any thematic text. Title only, deliberately: the same
#      committee also scrutinises non-housing local-government business such
#      as electoral regulations, and those items name the committee in their
#      BODY while their titles stay on-topic. Matching the body would readmit
#      exactly the noise this section exists to remove.
#
# Items in the "Noise" band never appear on the page regardless.
site:
  non_qualifying_themes:
    - committee_scrutiny              # other committees' names create context, not relevance
    - fiscal_and_legislative_context  # budgets and LCMs matter only when a housing theme also fires
  always_relevant_in_title:
    - Local Government, Housing and Planning Committee
    - Local Government and Housing Committee

  # Titles that NEVER appear on the page, checked before everything above.
  #
  # A committee's "Forward work programme" page is an index, not an
  # opportunity: it has no closing date, and its content is a pointer to the
  # committee's priorities consultation — which the page already lists on its
  # own, with a proper deadline. Showing both meant the directorate was told
  # about the Local Government, Housing and Planning Committee's priorities
  # consultation three times in one section (operator, 12 Aug 2026).
  #
  # Matched anywhere in the title, case-insensitively. Add a phrase here when
  # a class of page is administrative rather than actionable.
  suppress_titles:
    - Forward work programme
    - Completed work and published reports
    - Membership of the Committee

# -----------------------------------------------------------------------------
# THRESHOLDS
# -----------------------------------------------------------------------------
thresholds:
  # Items scoring below this are not stored at all. Set to 0 to store everything
  # (recommended while tuning, so you can see what you are missing).
  store_minimum: 10
  # Minimum score to appear in the default dashboard view.
  dashboard_minimum: 25
  # Consultations are never dropped regardless of score if they mention any
  # tier-1 or tier-2 theme, because the cost of missing a deadline is asymmetric.
  never_drop_consultations: true

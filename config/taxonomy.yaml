# =============================================================================
# NRLA Senedd Monitor — Relevance Taxonomy
# =============================================================================
# This file controls WHAT the monitor considers relevant and HOW LOUDLY it
# shouts about it. It is designed to be edited by policy staff, not developers.
#
# HOW SCORING WORKS
#   Every item collected (a speech, a written question, a consultation, a bill
#   stage) is scored:
#
#       score = (sum of matched theme weights)
#             + (sum of matched entity boosts)
#             + (sum of matched signal boosts)
#             x (source multiplier)
#
#   The score maps onto a priority band (see `bands` at the bottom), which
#   decides whether an item triggers an immediate alert, appears in the daily
#   digest, or simply sits in the searchable archive.
#
# MATCHING RULES
#   - All matching is case-insensitive.
#   - Terms are matched on WORD BOUNDARIES. "rent" will NOT match "current"
#     or "different". This matters: a naive substring match on "rent" produces
#     a flood of false positives, which is the single fastest way to get a
#     monitoring tool ignored.
#   - Multi-word terms are matched as phrases, tolerant of extra whitespace.
#   - A theme fires ONCE at its full weight no matter how many of its terms
#     match, but each DISTINCT theme that matches adds its own weight. An item
#     about rent controls in the private rented sector therefore scores higher
#     than one about rent controls alone, which is correct.
#   - `exclude_if` terms veto a theme match. Use these to stop known
#     false-positive patterns.
#
# EDITING GUIDANCE
#   - Raise a weight if the team keeps saying "this should have been flagged".
#   - Add an `exclude_if` term if the team keeps saying "this is noise".
#   - Add new people to `entities` after every reshuffle or by-election.
#   - Never delete a theme; set its weight to 0 to mute it. This preserves the
#     historical scores in the archive so trend data stays comparable.
# =============================================================================

meta:
  version: "1.0"
  updated: "2026-08-04"
  owner: "NRLA Policy Directorate"
  senedd_term: 7          # Seventh Senedd, 2026-2030
  review_due: "2026-09-14"  # Senedd returns from summer recess; re-verify people

# -----------------------------------------------------------------------------
# THEMES
# -----------------------------------------------------------------------------
# `weight` is the contribution to the score when any term in the theme matches.
#   50  = existential for NRLA members (rent controls, eviction reform)
#   35  = direct regulatory impact on landlords
#   25  = strong indirect impact
#   15  = context the team needs but that rarely needs action
#   5   = background awareness only
#
# `tier` groups themes for the dashboard's filter chips and the digest's
# section headings. Keep tier names short — they become UI labels.
# -----------------------------------------------------------------------------


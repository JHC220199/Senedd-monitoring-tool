# Daily automated run via GitHub Actions.
#
# WHY THIS IS THE FASTEST ROUTE TO "IT RUNS WITHOUT ME PROMPTING IT"
# ------------------------------------------------------------------
# It needs no server, no IT ticket and no infrastructure request. The schedule is
# version-controlled, and the archive is committed back after every run — so it
# accumulates permanently instead of starting fresh each day.
#
# Roughly 3 minutes of runner time per run, about 200 minutes a month. GitHub
# includes a monthly Actions allowance on paid plans and charges beyond it; the
# rates changed in January 2026, so check the current figure for your plan rather
# than trusting a number written here. Make the repository PRIVATE regardless —
# the archive is a curated view of NRLA's policy interests.
#
# ONE-TIME SETUP — see SETUP-GITHUB.md for the full version
#   1. Create a PRIVATE GitHub repo, e.g. nrla/senedd-monitor.
#   2. Unzip the delivered package into it and push. This file is already in the
#      right place at .github/workflows/monitor.yml, so it goes live on push.
#   3. Add repository secrets (Settings -> Secrets and variables -> Actions):
#        MONITOR_TO          first.last@nrla.org.uk (comma-separate several)
#        MONITOR_FROM        senedd-monitor@nrla.org.uk
#        MONITOR_SMTP_HOST   smtp.office365.com
#        MONITOR_SMTP_USER   senedd-monitor@nrla.org.uk
#        MONITOR_SMTP_PASS   (app password or a dedicated service account)
#      Optional, for the Welsh Government mailbox route:
#        MONITOR_MAILBOX     senedd-monitor@nrla.org.uk
#        MONITOR_GRAPH_TOKEN (app-only token, Mail.Read, scoped to that mailbox)
#   4. Actions -> "Senedd policy monitor" -> Run workflow, to prove it works.
#
# From then on it runs itself. Nobody prompts anything.
#
# HOW THE ARCHIVE PERSISTS
#   The database is committed back to the repo after every run as
#   `data/archive.sql` — plain SQL text, not the SQLite binary. Measured over 30
#   simulated daily commits, the binary produced 1.5 MB of git history against
#   396 KB for the text (3.7x). The bigger benefits are that `git log -p
#   data/archive.sql` shows exactly what the monitor found each day, and that an
#   unchanged archive is byte-identical so it produces no commit at all.
#
#   `data/monitor.sqlite3` is gitignored. It is rebuilt from the SQL on each run.
#
# THE ONE LIMITATION, STATED PLAINLY
#   GitHub's runners are datacentre hosts, so gov.wales returns 403 (see
#   SPECIFICATION.md section 4.4a). Every Senedd source works fine. The Welsh
#   Government half arrives through the shared-mailbox route, which is why
#   MONITOR_MAILBOX is worth setting up. Without it you get Senedd coverage only
#   — still the large majority of the value, but be clear-eyed that it is not
#   everything.

name: Senedd policy monitor

on:
  schedule:
    # 06.30 UTC on weekdays. In British Summer Time that is 07.30, so the
    # dashboard and digest are waiting before the working day starts.
    # Cron in GitHub Actions is always UTC — it does not follow BST.
    - cron: "30 6 * * 1-5"
    # A lighter weekend run, so a Friday-evening publication is not missed.
    - cron: "30 8 * * 6"
  workflow_dispatch:        # lets anyone run it on demand from the Actions tab

# Only one run at a time: two concurrent runs would both try to commit the
# archive and one would fail on a push conflict.
concurrency:
  group: senedd-monitor
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the updated archive
  issues: write             # the briefing issue IS the email — see below

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The `secrets` context cannot be used in a step-level `if:`, so the one
    # value we need to branch on is lifted into the `env` context here — which
    # `if:` can read. Only the hostname, deliberately: the password stays scoped
    # to the two steps that actually send, rather than sitting in the
    # environment of every step in the job.
    env:
      SMTP_HOST: ${{ secrets.MONITOR_SMTP_HOST }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tests first
        # A broken collector must not quietly publish a misleading dashboard.
        # 109 tests, under a second, and they have already caught bugs that
        # produced wrong results rather than errors.
        run: python -m tests.test_monitor

      - name: Restore the archive from the committed SQL export
        # This is what makes the archive cumulative. The archive is stored as
        # plain SQL text, not as the SQLite binary — git deltas text, the diff
        # is readable, and an unchanged archive produces no commit at all.
        # On the very first run there is no export yet; that is handled.
        run: python -m monitor.cli restore --from data/archive.sql

      - name: Collect, score and store
        env:
          MONITOR_MAILBOX: ${{ secrets.MONITOR_MAILBOX }}
          MONITOR_GRAPH_TOKEN: ${{ secrets.MONITOR_GRAPH_TOKEN }}
        # --govwales-route mailbox stops the unreachable gov.wales RSS being
        # reported as a broken source on a host where it can never work.
        # `|| true` because collect exits non-zero when a source fails, and we
        # still want the dashboard built and the failure surfaced on it.
        run: |
          python -m monitor.cli \
            --govwales-route mailbox \
            collect --days 21 || true

      - name: Build the dashboard
        run: python -m monitor.cli dashboard --out out/index.html

      - name: Put the briefing on this page
        # THE MOST IMPORTANT STEP FOR A HUMAN READER.
        #
        # The first live run finished green, collected 257 items, committed them
        # — and produced nothing anyone could read. The dashboard went to
        # out/index.html, which is gitignored, and then into a build artifact: a
        # zip file behind three clicks at the foot of a log page. Nobody is
        # doing that daily, and they should not have to.
        #
        # GitHub renders markdown written to $GITHUB_STEP_SUMMARY on the run
        # page itself. So the briefing goes there. Click the run, read the work.
        # No email setup, no download, no server, and — unlike GitHub Pages —
        # it works on a private repository.
        run: |
          python -m monitor.cli brief \
            --days 21 \
            --note "Full searchable dashboard: the senedd-dashboard artifact at the foot of this page." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Build the hosted database page
        # THE PAGE. GitHub Pages serves docs/ on a public repository, giving
        #   https://jhc220199.github.io/Senedd-monitoring-tool/
        # in the same house style as PA-Monitoring-Tools and the Research Live
        # Database. Everything before this was a file — gitignored HTML, a build
        # artifact, a CI log page, a markdown document — and none of them was a
        # URL anyone could open or send to a colleague.
        #
        # Committed below, so the live page updates itself on every run.
        run: python -m monitor.cli site --out docs/index.html

      - name: Publish the briefing — bookmarkable page, weekly copy, and email
        # THE STEP THAT MAKES THIS A USABLE TOOL.
        #
        # Three previous attempts at "somewhere to read it" all put the output
        # somewhere nobody would go: a gitignored file, a zip inside a build
        # artifact, and then this very run page — which cannot be bookmarked
        # because its URL changes every run. Meanwhile the email needed five
        # SMTP secrets that require an IT request, so it never arrived.
        #
        # GITHUB_TOKEN is injected into every workflow run automatically, so all
        # three of these need no configuration whatsoever:
        #
        #   BRIEFING.md            one permanent URL, always current, renders on
        #                          a PRIVATE repo — which GitHub Pages does not
        #   briefings/2026-Wnn.md  the permanent weekly record
        #   a dated issue          GitHub emails watchers when an issue opens,
        #                          so this IS the daily digest. It is also a
        #                          bookmarkable page, and GitHub issue search
        #                          gives full-text search over every briefing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m monitor.cli publish \
            --days 21 \
            --file BRIEFING.md \
            --week-dir briefings

      - name: Note where the briefing went
        # No longer a warning, because delivery no longer depends on SMTP. The
        # issue opened above is emailed by GitHub to everyone watching this
        # repository, so the digest arrives with nothing configured. SMTP is now
        # an optional upgrade — a nicer-looking email from an NRLA address — not
        # a prerequisite.
        if: env.SMTP_HOST == ''
        run: |
          {
            echo ""
            echo "> [!NOTE]"
            echo "> **This briefing was emailed via the GitHub issue opened by"
            echo "> this run**, to everyone watching the repository. It is also"
            echo "> always at [BRIEFING.md](../../blob/main/BRIEFING.md)."
            echo ">"
            echo "> Not receiving it? Check **Watch → All Activity** on the"
            echo "> repository, and that GitHub emails reach your inbox."
            echo ">"
            echo "> Optional: adding \`MONITOR_SMTP_HOST\`, \`MONITOR_SMTP_USER\`,"
            echo "> \`MONITOR_SMTP_PASS\`, \`MONITOR_FROM\` and \`MONITOR_TO\` sends"
            echo "> the formatted digest from an NRLA address as well."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send the daily digest
        # Runs only once SMTP is configured, so an unconfigured repo is not a
        # red run every morning. When it IS configured and sending fails, the
        # CLI exits non-zero and annotates the run — see _report_not_sent() in
        # cli.py. A failed send is an error; a deliberate dry run is not.
        if: env.SMTP_HOST != ''
        env:
          MONITOR_FROM: ${{ secrets.MONITOR_FROM }}
          MONITOR_TO: ${{ secrets.MONITOR_TO }}
          MONITOR_SMTP_HOST: ${{ secrets.MONITOR_SMTP_HOST }}
          MONITOR_SMTP_USER: ${{ secrets.MONITOR_SMTP_USER }}
          MONITOR_SMTP_PASS: ${{ secrets.MONITOR_SMTP_PASS }}
        run: python -m monitor.cli digest --days 1 --send

      - name: Alert on anything critical
        if: env.SMTP_HOST != ''
        env:
          MONITOR_FROM: ${{ secrets.MONITOR_FROM }}
          MONITOR_TO: ${{ secrets.MONITOR_TO }}
          MONITOR_SMTP_HOST: ${{ secrets.MONITOR_SMTP_HOST }}
          MONITOR_SMTP_USER: ${{ secrets.MONITOR_SMTP_USER }}
          MONITOR_SMTP_PASS: ${{ secrets.MONITOR_SMTP_PASS }}
        run: python -m monitor.cli alert --send

      - name: Write the permanent weekly record
        # One fixed HTML page per complete ISO week. Re-scoring the archive later
        # does not change an existing snapshot, which is what makes it an audit
        # trail rather than just a view.
        run: python -m monitor.cli snapshots --out out/weeks

      - name: Publish the dashboard as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: senedd-dashboard-${{ github.run_number }}
          path: out/
          retention-days: 90

      - name: Commit the updated archive and weekly records
        run: |
          python -m monitor.cli export --out data/archive.sql
          git config user.name  "senedd-monitor"
          git config user.email "senedd-monitor@nrla.org.uk"
          git add data/archive.sql out/weeks BRIEFING.md briefings docs
          if git diff --staged --quiet; then
            # Genuinely nothing new. The export is deterministic, so identical
            # data produces an identical file and therefore no commit — which is
            # exactly what should happen during recess.
            echo "Archive unchanged — nothing to commit."
          else
            git commit -m "Archive update $(date -u +'%Y-%m-%d')"
            # Rebase in case a manual run committed while this one was working.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Report run health in the job summary
        if: always()
        run: |
          {
            echo "## Senedd monitor run"
            echo ""
            python -m monitor.cli stats
          } >> "$GITHUB_STEP_SUMMARY"

# OPTIONAL: publish the dashboard to a URL the directorate can bookmark.
# GitHub Pages on a private repo needs GitHub Enterprise, so for most NRLA
# setups the better route is to have the workflow push out/index.html into
# SharePoint via Microsoft Graph. That needs a Files.ReadWrite.All app
# registration scoped to one document library — worth doing, but do it as a
# second step once the daily run is proven.
